<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }

        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }

        .result {
            margin-top: 10px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 4px;
        }

        .success {
            background: #d4edda;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>

<body>
    <h1>SkillBridge Authentication Test</h1>

    <div class="test-section">
        <h2>Test Signup</h2>
        <button onclick="testSignup()">Test Signup</button>
        <div id="signup-result" class="result"></div>
    </div>

    <div class="test-section">
        <h2>Test Login</h2>
        <button onclick="testLogin()">Test Login (john@example.com)</button>
        <div id="login-result" class="result"></div>
    </div>

    <div class="test-section">
        <h2>Test Backend Health</h2>
        <button onclick="testHealth()">Check Backend</button>
        <div id="health-result" class="result"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';

        async function testHealth() {
            const resultDiv = document.getElementById('health-result');
            try {
                const response = await fetch(`${API_URL}/health`);
                const data = await response.json();
                resultDiv.className = 'result success';
                resultDiv.innerHTML = `<strong>✓ Backend is running!</strong><br>${JSON.stringify(data, null, 2)}`;
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<strong>✗ Backend Error:</strong><br>${error.message}`;
            }
        }

        async function testSignup() {
            const resultDiv = document.getElementById('signup-result');
            try {
                const response = await fetch(`${API_URL}/auth/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: 'Test User ' + Date.now(),
                        email: `test${Date.now()}@example.com`,
                        password: 'password123',
                        role: 'WORKER'
                    })
                });

                const data = await response.json();

                if (data.success) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `<strong>✓ Signup Successful!</strong><br>User: ${data.user.name}<br>Email: ${data.user.email}<br>Role: ${data.user.role}`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `<strong>✗ Signup Failed:</strong><br>${data.message || JSON.stringify(data)}`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<strong>✗ Network Error:</strong><br>${error.message}`;
            }
        }

        async function testLogin() {
            const resultDiv = document.getElementById('login-result');
            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'john@example.com',
                        password: 'password123'
                    })
                });

                const data = await response.json();

                if (data.success) {
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `<strong>✓ Login Successful!</strong><br>User: ${data.user.name}<br>Email: ${data.user.email}<br>Role: ${data.user.role}`;
                } else {
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `<strong>✗ Login Failed:</strong><br>${data.message || JSON.stringify(data)}`;
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `<strong>✗ Network Error:</strong><br>${error.message}`;
            }
        }

        // Auto-check backend on load
        window.onload = testHealth;
    </script>
</body>

</html>
